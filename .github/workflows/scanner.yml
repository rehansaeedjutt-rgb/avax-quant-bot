name: AVAX Scanner

on:
  schedule:
    # Har ghante chalega (UTC 0 minute par)
    - cron: '0 * * * *'
  workflow_dispatch: # Manual test ke liye button

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # State files commit karne ke liye zaroori

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python src/scanner_gh.py

      - name: Commit state files
        run: |
          git config user.name "avax-bot"
          git config user.email "bot@avax.local"
          git add config/scanner_state.json config/paper_state.json config/paper_trades.json || true
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true
