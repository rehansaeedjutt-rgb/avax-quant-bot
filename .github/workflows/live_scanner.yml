name: AVAX Live Signal Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: live-v1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests pyvsmc
      - name: Run live scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python src/live_scanner.py
      - name: Commit state (force)
        run: |
          git config user.name "avax-live"
          git config user.email "live@avax.local"
          git add -f config/live_state.json config/live_trades.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Live update [skip ci]"
          git pull --rebase origin main || true
          git push || true
