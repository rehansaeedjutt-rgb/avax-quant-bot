name: AVAX Grid Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  grid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: grid-v1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests
      - name: Run grid bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python src/grid_bot_live.py
      - name: Commit state (rebase-safe)
        run: |
          git config user.name "avax-grid"
          git config user.email "grid@avax.local"
          git add config/grid_state.json config/grid_trades.json || true
          git diff --staged --quiet || git commit -m "Grid update [skip ci]"
          git pull --rebase origin main || true
          git push || true
